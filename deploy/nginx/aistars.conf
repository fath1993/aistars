# The project's own nginx, inside its compose stack.
#
# HTTPS is done by Cloudflare. Cloudflare reaches the server's edge proxy
# (Traefik) over plain HTTP, and the edge forwards here with the original Host
# and Cloudflare's X-Forwarded-* headers. Nothing in this file is specific to
# the host machine.

# The edge connects from the Docker bridge; skip it, so $remote_addr is the
# address that connected to the server (Cloudflare), as on the host nginx.
# The visitor's own IP stays first in X-Forwarded-For.
set_real_ip_from 172.16.0.0/12;
set_real_ip_from 127.0.0.1;
real_ip_header X-Forwarded-For;
real_ip_recursive on;

server {
    listen 80;
    server_name _;

    # Telegram and Higgsfield post small JSON. Nothing here accepts uploads.
    client_max_body_size 2M;

    # collectstatic output, mounted read-only from /var/www/aistars/static.
    location /static/ {
        alias /static/;
        access_log off;
        expires 30d;
        add_header Cache-Control "public";
    }

    location / {
        proxy_pass http://aistars:8000;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $http_x_forwarded_for;
        # From the edge, NOT $scheme: inside the stack the scheme is always
        # http, and Django (SECURE_PROXY_SSL_HEADER) would then treat every
        # request as insecure -- the admin login would never stick.
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;

        proxy_read_timeout    60s;
        proxy_connect_timeout 10s;
        proxy_send_timeout    60s;
    }
}
